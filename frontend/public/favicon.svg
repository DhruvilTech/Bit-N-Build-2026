<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="green" x1="120" y1="90" x2="390" y2="410" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2dd48f"/>
    <stop offset="1" stop-color="#18b979"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- rear motion bars -->
<g fill="none" stroke="#2dd48f" stroke-linecap="round">
  <path d="M72 185 H126" stroke-width="12" opacity=".22">
    <animate attributeName="x1" values="72;48;72" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="126;102;126" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.5;.12" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M82 218 H132" stroke-width="7" opacity=".18">
    <animate attributeName="x1" values="82;55;82" dur=".9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="132;105;132" dur=".9s" repeatCount="indefinite"/>
  </path>
</g>

<!-- single continuous E -->
<path d="M128 120
         C128 103 141 92 158 92
         H300
         L329 121
         H163
         V174
         H277
         L299 197
         L277 220
         H163
         V273
         H329
         L300 302
         H158
         C141 302 128 291 128 274 Z"
      fill="url(#green)"/>

<!-- X formed by two clean forward strokes -->
<path d="M276 120 L335 179 L394 120 H431 L353 197 L431 274 H394 L335 215 L276 274 H239 L317 197 L239 120 Z"
      fill="url(#green)"/>

<!-- central emergency pulse cutout -->
<path d="M166 197
         H199
         L210 197
         L222 181
         L235 215
         L250 164
         L266 207
         L278 197"
      fill="none"
      stroke="#ffffff"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="150"
      stroke-dashoffset="150">
  <animate attributeName="stroke-dashoffset"
           values="150;0;-150"
           dur="1.8s"
           repeatCount="indefinite"/>
</path>

<!-- One controlled highlight following the X edge -->
<path d="M276 120 L335 179 L394 120"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      opacity=".0">
  <animate attributeName="opacity" values="0;.75;0" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- tiny live pulse at the point where E and X meet -->
<circle cx="335" cy="197" r="5" fill="#ffffff" filter="url(#glow)">
  <animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;.25;.9" dur="1.2s" repeatCount="indefinite"/>
</circle>

<!-- forward arrow built into the geometry -->
<path d="M402 326 H444 L430 312 M444 326 L430 340"
      fill="none" stroke="#2dd48f" stroke-width="7"
      stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="80" stroke-dashoffset="80">
  <animate attributeName="stroke-dashoffset"
           values="80;0;80" dur="1.5s" repeatCount="indefinite"/>
</path>
</svg>
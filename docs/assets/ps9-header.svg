<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810" />
      <stop offset="40%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#03060C" />
    </linearGradient>

    <linearGradient id="primary-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="alert-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB4A4A" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="radar-sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="emergenx-brand" x1="120" y1="90" x2="390" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#2dd48f" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="tactical-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#2DD4BF" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Base Plate -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="340" fill="url(#tactical-grid)" rx="16" />

  <!-- Left Tactical Radar Scope -->
  <g transform="translate(130, 170)">
    <!-- Scope rings -->
    <circle cx="0" cy="0" r="110" fill="#06121E" fill-opacity="0.6" stroke="#1E3A5F" stroke-width="1.5" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1E3A5F" stroke-width="1" />

    <!-- Crosshairs -->
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Rotating Radar Beam -->
    <g>
      <path d="M 0 0 L 110 0 A 110 110 0 0 0 78 -78 Z" fill="url(#radar-sweep-grad)" />
      <line x1="0" y1="0" x2="110" y2="0" stroke="#2DD4BF" stroke-width="2" filter="url(#glow-teal)" />
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"
      />
    </g>

    <!-- Pulsing Critical Incident Node (P1 Fire) -->
    <circle cx="45" cy="-35" r="4.5" fill="#FB4A4A" filter="url(#glow-red)" />
    <circle cx="45" cy="-35" r="12" fill="none" stroke="#FB4A4A" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="4.5;24;4.5" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="56" y="-32" fill="#FB4A4A" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="1">ER-2048</text>

    <!-- Responding Field Team Node -->
    <circle cx="-35" cy="50" r="3.5" fill="#2DD4BF" filter="url(#glow-teal)" />
    <line x1="-35" y1="50" x2="45" y2="-35" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="28;0" dur="1.2s" repeatCount="indefinite" />
    </line>
    <text x="-75" y="65" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="8" font-weight="600">FT-04 [DISPATCHED]</text>

    <!-- Secondary Node (Ambulance) -->
    <circle cx="20" cy="60" r="3" fill="#F5A623" />
    <text x="28" y="64" fill="#F5A623" font-family="ui-monospace, monospace" font-size="8">AM-07</text>
  </g>

  <!-- Center HUD Divider Bracket -->
  <path d="M 275 50 L 290 50 L 290 290 L 275 290" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Center Main Content -->
  <g transform="translate(315, 0)">
    <!-- Top System Telemetry Line -->
    <g transform="translate(0, 48)">
      <circle cx="4" cy="-4" r="3" fill="#2DD4BF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="0" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
        PS-9 // EMERGENCY OPS // BIT-N-BUILD 2026 // LIVE TELEMETRY MESH ONLINE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="106" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      EMERGEN<tspan fill="url(#primary-teal)">X</tspan>
      <tspan fill="#64748B" font-size="28" font-weight="400"> // PS-9</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
      Intelligent Emergency Response &amp; Resource Coordination Platform
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="172" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      Transforming fragmented emergency telemetry into a synchronized, AI-assisted operational command.
    </text>
    <text x="0" y="193" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      Automates multi-source report clustering, severity estimation, nearest-unit dispatch &amp; SLA delay escalation.
    </text>

    <!-- Operational Badges (Pills) -->
    <g transform="translate(0, 226)">
      <!-- Badge 1: Real-time GIS -->
      <g>
        <rect x="0" y="0" width="146" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="12" cy="13" r="3" fill="#38BDF8" />
        <text x="22" y="17" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="10" font-weight="700">2DSPHERE GIS MAP</text>
      </g>

      <!-- Badge 2: AI Triage -->
      <g transform="translate(154, 0)">
        <rect x="0" y="0" width="154" height="26" rx="6" fill="#0F172A" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="12" cy="13" r="3" fill="#A78BFA" />
        <text x="22" y="17" fill="#DDD6FE" font-family="ui-monospace, monospace" font-size="10" font-weight="700">AI TRIAGE &amp; FUSION</text>
      </g>

      <!-- Badge 3: Fleet Dispatch -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#0F172A" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="12" cy="13" r="3" fill="#2DD4BF" />
        <text x="22" y="17" fill="#99F6E4" font-family="ui-monospace, monospace" font-size="10" font-weight="700">AUTONOMOUS DISPATCH</text>
      </g>

      <!-- Badge 4: SLA Monitor -->
      <g transform="translate(492, 0)">
        <rect x="0" y="0" width="144" height="26" rx="6" fill="#0F172A" stroke="#FB4A4A" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="12" cy="13" r="3" fill="#FB4A4A" />
        <text x="22" y="17" fill="#FECDD3" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SLA DELAY MONITOR</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 282)">
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">
        LATENCY: &lt;18ms // WS: CONNECTED // DEFENSE-GRADE RBAC // LEAFLET CARTO-DARK
      </text>
    </g>
  </g>

  <!-- Right Side: Official EmergenX Vector Emblem (Size 170x170) -->
  <g transform="translate(1005, 55)">
    <!-- Ambient glow behind emblem -->
    <circle cx="85" cy="85" r="75" fill="#2DD4BF" fill-opacity="0.08" filter="url(#glow-teal)" />

    <!-- Vector emblem container -->
    <g transform="scale(0.35)">
      <!-- Rear motion bars -->
      <g fill="none" stroke="#2DD4BF" stroke-linecap="round">
        <path d="M72 185 H126" stroke-width="14" opacity=".25">
          <animate attributeName="x1" values="72;48;72" dur="1.1s" repeatCount="indefinite" />
          <animate attributeName="x2" values="126;102;126" dur="1.1s" repeatCount="indefinite" />
          <animate attributeName="opacity" values=".15;.6;.15" dur="1.1s" repeatCount="indefinite" />
        </path>
        <path d="M82 218 H132" stroke-width="9" opacity=".2">
          <animate attributeName="x1" values="82;55;82" dur=".9s" repeatCount="indefinite" />
          <animate attributeName="x2" values="132;105;132" dur=".9s" repeatCount="indefinite" />
        </path>
      </g>

      <!-- E glyph -->
      <path
        d="M128 120 C128 103 141 92 158 92 H300 L329 121 H163 V174 H277 L299 197 L277 220 H163 V273 H329 L300 302 H158 C141 302 128 291 128 274 Z"
        fill="url(#emergenx-brand)"
      />

      <!-- X glyph -->
      <path
        d="M276 120 L335 179 L394 120 H431 L353 197 L431 274 H394 L335 215 L276 274 H239 L317 197 L239 120 Z"
        fill="url(#emergenx-brand)"
      />

      <!-- ECG Pulse Cutout -->
      <path
        d="M166 197 H199 L210 197 L222 181 L235 215 L250 164 L266 207 L278 197"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="150"
        stroke-dashoffset="150"
      >
        <animate
          attributeName="stroke-dashoffset"
          values="150;0;-150"
          dur="1.8s"
          repeatCount="indefinite"
        />
      </path>

      <!-- Center pulse node -->
      <circle cx="335" cy="197" r="6" fill="#FFFFFF" filter="url(#glow-teal)">
        <animate attributeName="r" values="5;9;5" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".9;.3;.9" dur="1.2s" repeatCount="indefinite" />
      </circle>

      <!-- Forward telemetry arrow -->
      <path
        d="M402 326 H444 L430 312 M444 326 L430 340"
        fill="none"
        stroke="#2DD4BF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="80"
        stroke-dashoffset="80"
      >
        <animate
          attributeName="stroke-dashoffset"
          values="80;0;80"
          dur="1.5s"
          repeatCount="indefinite"
        />
      </path>
    </g>

    <!-- Caption under emblem -->
    <text x="85" y="195" text-anchor="middle" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="2">
      EMERGENX CORE
    </text>
    <text x="85" y="210" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1">
      COMMAND SYSTEM
    </text>
  </g>

  <!-- Animated ECG Baseline along Bottom Edge -->
  <g transform="translate(0, 326)">
    <line x1="16" y1="0" x2="1184" y2="0" stroke="#1E293B" stroke-width="1.5" />
    <path
      d="M 16 0 L 400 0 L 420 -8 L 430 10 L 445 -16 L 460 14 L 475 -6 L 490 0 L 800 0 L 820 -8 L 830 10 L 845 -16 L 860 14 L 875 -6 L 890 0 L 1184 0"
      fill="none"
      stroke="#2DD4BF"
      stroke-width="1.5"
      stroke-opacity="0.75"
      stroke-dasharray="600"
      stroke-dashoffset="600"
    >
      <animate
        attributeName="stroke-dashoffset"
        values="600;0;-600"
        dur="3s"
        repeatCount="indefinite"
      />
    </path>
  </g>
</svg>
